name: Build and sign images

on:
  push:
    branches: [v2]
    tags: ['v*']
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: innuucp
            dockerfile: Dockerfile.innuucp
          - name: gnuuaio
            dockerfile: Dockerfile.gnuuaio
          - name: postfix
            dockerfile: Dockerfile.postfix
          - name: busybox
            dockerfile: Dockerfile.busybox
          - name: nginx
            dockerfile: Dockerfile.nginx
          - name: python
            dockerfile: Dockerfile.python
          - name: s3adm
            dockerfile: Dockerfile.s3adm
          - name: szip-build
            dockerfile: Dockerfile.szip-build
          - name: uucp-build
            dockerfile: Dockerfile.uucp-build
          - name: grok_exporter
            dockerfile: Dockerfile.grok
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=v2,enable=${{ github.ref == 'refs/heads/v2' }}
            type=semver,pattern={{version}}
            type=ref,event=pr
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign pushed image by digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
