name: Mirror and sign image

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source image including tag (eg. docker.io/vectorim/element-web:v1.12.35)'
        required: true
      destination:
        description: 'Destination image including tag (eg. ghcr.io/gnuu-de/element-web:v1.12.35)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  mirror-and-sign:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Detect destination PAT
        id: pat
        env:
          DEST_PASSWORD: ${{ secrets.DEST_PASSWORD }}
        run: |
          if [ -n "$DEST_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR with GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # imagetools copies the full manifest list, so a multi-arch source stays
      # multi-arch. No local docker pull/build is involved.
      # GITHUB_TOKEN only works when the package is linked to this repository or
      # granted write access under "Manage Actions access".
      - name: Mirror with GITHUB_TOKEN
        id: mirror-token
        continue-on-error: true
        run: docker buildx imagetools create --tag "${{ inputs.destination }}" "${{ inputs.source }}"
      # Fall back to the PAT used by the dockerhub-mirror workflow. Needed when
      # the package already exists but is not linked to this repository.
      - name: Login to GHCR with PAT
        if: steps.mirror-token.outcome == 'failure' && steps.pat.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DEST_USERNAME }}
          password: ${{ secrets.DEST_PASSWORD }}
      - name: Mirror with PAT
        if: steps.mirror-token.outcome == 'failure' && steps.pat.outputs.available == 'true'
        run: docker buildx imagetools create --tag "${{ inputs.destination }}" "${{ inputs.source }}"
      - name: Explain permission failure
        if: steps.mirror-token.outcome == 'failure' && steps.pat.outputs.available == 'false'
        run: |
          echo "::error::GITHUB_TOKEN may not write to ${{ inputs.destination }} and no PAT is configured."
          echo "Grant Write access to this repository under the package settings"
          echo "(Package -> Settings -> Manage Actions access) or set DEST_USERNAME/DEST_PASSWORD."
          exit 1
      - name: Resolve destination digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "${{ inputs.destination }}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Mirrored ${{ inputs.destination }}@${digest}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Keep in sync with the cosign version used by the cosignwebhook verifier.
          cosign-release: 'v3.0.6'
      - name: Sign mirrored image by digest
        env:
          IMAGE: ${{ inputs.destination }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # The current key has an empty passphrase. The variable must still be
          # set, otherwise cosign v3 tries to prompt on a non-interactive runner.
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        # Key-based signing (not keyless): the cosignwebhook verifies against the
        # static public key in COSIGNPUBKEY and rejects Fulcio certificates.
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
